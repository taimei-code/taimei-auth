services:
  taimei-auth-postgres:
    image: postgres:16.8-alpine3.21
    environment:
      POSTGRES_DB: auth
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - taimei-auth-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: pg_isready -h 127.0.0.1 -U postgres -d auth
      interval: 3s
      timeout: 3s
      retries: 10

  taimei-auth:
    image: __TAIMEI_AUTH_TESTING_IMAGE__
    command: sh -c "bun run db:migrate && bun run db:migrate-manual && bun run testing/server.ts"
    environment:
      PORT: ${TAIMEI_AUTH_PORT:-3100}
      DATABASE_URL: postgres://postgres@taimei-auth-postgres:5432/auth
      AUTH_SERVICE_URL: ${TAIMEI_AUTH_URL:?TAIMEI_AUTH_URL is required}
      AUTH_COOKIE_DOMAIN: ${TAIMEI_AUTH_COOKIE_DOMAIN?TAIMEI_AUTH_COOKIE_DOMAIN is required (empty for localhost)}
      AUTH_TRUSTED_ORIGINS: ${TAIMEI_AUTH_URL},${TAIMEI_AUTH_CONSUMER_ORIGINS:?TAIMEI_AUTH_CONSUMER_ORIGINS is required}
      AUTH_SECRET: ${TAIMEI_AUTH_SECRET:?TAIMEI_AUTH_SECRET is required}
      AUTH_SERVICE_KEY: ${TAIMEI_AUTH_SERVICE_KEY:?TAIMEI_AUTH_SERVICE_KEY is required (the same value as the service key of the consumer)}
      AUTH_TRUSTED_PROXY_HOPS: "0"
      APP_ENV: test
      APP_NAME: ${TAIMEI_AUTH_APP_NAME:?TAIMEI_AUTH_APP_NAME is required}
      MFA_TOTP_ENCRYPTION_KEYS: v1:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:' + process.env.PORT + '/health').then((res) => process.exit(res.ok ? 0 : 1), () => process.exit(1))"]
      interval: 2s
      timeout: 3s
      retries: 30
    depends_on:
      taimei-auth-postgres:
        condition: service_healthy
    networks:
      default:
        aliases:
          - ${TAIMEI_AUTH_HOSTNAME:?TAIMEI_AUTH_HOSTNAME is required}

volumes:
  taimei-auth-postgres-data:
