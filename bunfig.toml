[test]
preload = ["./src/__tests__/preload.ts"]

[install]
minimumReleaseAge = 604800
# 7 日齢に満たない security fix の一時 bypass (満たしたら外す): esbuild GHSA-gv7w-rqvm-qjhr、undici GHSA-vxpw-j846-p89q (overrides で 6.27.0 に固定)、nanoid GHSA-28wg-ghj8-5hjv / GHSA-2v37-7h3g-55p8
# esbuild は platform 別の @esbuild/<os>-<arch> も同時に止まり、このキーに glob は使えないため全 platform を列挙する (lockfile を全 OS の frozen install で解決させるため)
minimumReleaseAgeExcludes = [
  "nanoid",
  "undici",
  "esbuild",
  "@esbuild/aix-ppc64",
  "@esbuild/android-arm",
  "@esbuild/android-arm64",
  "@esbuild/android-x64",
  "@esbuild/darwin-arm64",
  "@esbuild/darwin-x64",
  "@esbuild/freebsd-arm64",
  "@esbuild/freebsd-x64",
  "@esbuild/linux-arm",
  "@esbuild/linux-arm64",
  "@esbuild/linux-ia32",
  "@esbuild/linux-loong64",
  "@esbuild/linux-mips64el",
  "@esbuild/linux-ppc64",
  "@esbuild/linux-riscv64",
  "@esbuild/linux-s390x",
  "@esbuild/linux-x64",
  "@esbuild/netbsd-arm64",
  "@esbuild/netbsd-x64",
  "@esbuild/openbsd-arm64",
  "@esbuild/openbsd-x64",
  "@esbuild/openharmony-arm64",
  "@esbuild/sunos-x64",
  "@esbuild/win32-arm64",
  "@esbuild/win32-ia32",
  "@esbuild/win32-x64",
]
