[test]
preload = ["./src/__tests__/preload.ts"]

[install]
minimumReleaseAge = 604800
# esbuild は、GHSA-gv7w-rqvm-qjhr (HIGH) の修正版 0.28.1 が release から 2 日で 7 日齢に満たないため除外する。
# esbuild は実体の binary を platform 別の @esbuild/<os>-<arch> という optionalDependencies で持ち、これらも
# 同時に publish された (2 日) ため個別に止められ、lockfile から落ちる (CI の frozen install で「@esbuild/linux-x64
# could not be found」になる)。glob (@esbuild/*) はこのキーでは使えないため、全 platform を明示的に列挙する
# (lockfile を linux、mac、win のどの frozen install でも解決できるように保つには全 platform が要る)。
# esbuild は build 専用の devDep で、advisory は build 時の RCE である。詳細は docs/adr/0009-supply-chain-hardening.md を参照。
#
# undici は、GHSA-vxpw-j846-p89q (HIGH、WebSocket の DoS) の修正版 6.27.0 が release から 5 日で 7 日齢に
# 満たないため除外する。@vercel/blob の推移的依存で、overrides により 6.27.0 に固定する。advisory は
# WebSocket client のもので、@vercel/blob は HTTP fetch にしか使わないためこのアプリには該当しないが、CI の
# bun audit gate を通すため修正版へ上げる。esbuild と同じ「security patch が 7 日未満」の場合の bypass である。
# 詳細は docs/adr/0009-supply-chain-hardening.md §H を参照。
#
# nanoid は、GHSA-28wg-ghj8-5hjv と GHSA-2v37-7h3g-55p8 (HIGH、非 secure および custom generator が不正な
# size で無限ループする) の 3.x 系修正版 3.3.18 が release から 7 日目で 7 日齢に満たないため除外する。postcss の
# 推移的依存である (5.x 系の直接依存側は 5.1.16 で 7 日齢を満たすため bypass は不要)。nanoid は pure JS
# で platform 別の optionalDependencies を持たないため、esbuild と違い 1 entry で足りる。
# 詳細は docs/adr/0009-supply-chain-hardening.md §H を参照。
minimumReleaseAgeExcludes = [
  "nanoid",
  "undici",
  "esbuild",
  "@esbuild/aix-ppc64",
  "@esbuild/android-arm",
  "@esbuild/android-arm64",
  "@esbuild/android-x64",
  "@esbuild/darwin-arm64",
  "@esbuild/darwin-x64",
  "@esbuild/freebsd-arm64",
  "@esbuild/freebsd-x64",
  "@esbuild/linux-arm",
  "@esbuild/linux-arm64",
  "@esbuild/linux-ia32",
  "@esbuild/linux-loong64",
  "@esbuild/linux-mips64el",
  "@esbuild/linux-ppc64",
  "@esbuild/linux-riscv64",
  "@esbuild/linux-s390x",
  "@esbuild/linux-x64",
  "@esbuild/netbsd-arm64",
  "@esbuild/netbsd-x64",
  "@esbuild/openbsd-arm64",
  "@esbuild/openbsd-x64",
  "@esbuild/openharmony-arm64",
  "@esbuild/sunos-x64",
  "@esbuild/win32-arm64",
  "@esbuild/win32-ia32",
  "@esbuild/win32-x64",
]
