[install]
minimumReleaseAge = 604800
# esbuild: GHSA-gv7w-rqvm-qjhr (HIGH) の修正版 0.28.1 が release 2 日で 7 日齢に満たないため除外。
# esbuild は実体 binary を platform 別 @esbuild/<os>-<arch> の optionalDependencies で持ち、これらも
# 同時 publish (2 日) で個別に block され lockfile から落ちる (CI frozen install で「@esbuild/linux-x64
# could not be found」)。glob (@esbuild/*) は本キーで効かないため全 platform を明示列挙する
# (lockfile を linux/mac/win いずれの frozen install でも解決可能に保つため全 platform 必要)。
# build 専用 devDep / advisory は build 時 RCE。詳細: docs/adr/0009-supply-chain-hardening.md
#
# undici: GHSA-vxpw-j846-p89q (HIGH, WebSocket DoS) の修正版 6.27.0 が release 5 日で 7 日齢に
# 満たないため除外。@vercel/blob の transitive で overrides により 6.27.0 に固定する。advisory は
# WebSocket client のもので @vercel/blob は HTTP fetch 用途のため本アプリでは非該当だが、CI の
# bun audit gate を通すため patched 版へ。esbuild と同じ「security patch < 7 日」の bypass。
# 詳細: docs/adr/0009-supply-chain-hardening.md §H
#
# nanoid: GHSA-28wg-ghj8-5hjv / GHSA-2v37-7h3g-55p8 (HIGH, 非 secure / custom generator が不正な
# size で無限ループ) の 3.x 系修正版 3.3.18 が release 7 日目で 7 日齢に満たないため除外。postcss の
# transitive (5.x 系の direct dep 側は 5.1.16 で 7 日齢を満たすため bypass 不要)。nanoid は pure JS
# で platform 別 optionalDependencies を持たないため esbuild と違い 1 entry で足りる。
# 詳細: docs/adr/0009-supply-chain-hardening.md §H
minimumReleaseAgeExcludes = [
  "nanoid",
  "undici",
  "esbuild",
  "@esbuild/aix-ppc64",
  "@esbuild/android-arm",
  "@esbuild/android-arm64",
  "@esbuild/android-x64",
  "@esbuild/darwin-arm64",
  "@esbuild/darwin-x64",
  "@esbuild/freebsd-arm64",
  "@esbuild/freebsd-x64",
  "@esbuild/linux-arm",
  "@esbuild/linux-arm64",
  "@esbuild/linux-ia32",
  "@esbuild/linux-loong64",
  "@esbuild/linux-mips64el",
  "@esbuild/linux-ppc64",
  "@esbuild/linux-riscv64",
  "@esbuild/linux-s390x",
  "@esbuild/linux-x64",
  "@esbuild/netbsd-arm64",
  "@esbuild/netbsd-x64",
  "@esbuild/openbsd-arm64",
  "@esbuild/openbsd-x64",
  "@esbuild/openharmony-arm64",
  "@esbuild/sunos-x64",
  "@esbuild/win32-arm64",
  "@esbuild/win32-ia32",
  "@esbuild/win32-x64",
]
