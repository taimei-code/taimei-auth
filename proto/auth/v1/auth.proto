syntax = "proto3";
package auth.v1;

service AuthService {
  rpc VerifySession(VerifySessionRequest) returns (VerifySessionResponse);
}

service UserService {
  rpc FindUserByEmail(FindUserByEmailRequest) returns (FindUserByEmailResponse);
}

// VerifySession の失敗理由を表現する enum。
// SESSION_EXPIRED / USER_LOCKED は現状到達不能、将来
// session.expires_at による期限切れ判定 / user lock を実装した時点で活性化する。
enum Result {
  RESULT_UNSPECIFIED = 0;
  RESULT_OK = 1;
  RESULT_SESSION_NOT_FOUND = 2;
  RESULT_SESSION_EXPIRED = 3;
  RESULT_USER_DELETED = 4;
  RESULT_USER_LOCKED = 5;
  RESULT_REVOKED = 6;
  RESULT_REVISION_OUTDATED = 7;
}

// membership.role と同じ 3 値。
enum Role {
  ROLE_UNSPECIFIED = 0;
  ROLE_OWNER = 1;
  ROLE_ADMIN = 2;
  ROLE_MEMBER = 3;
}

// 共通メッセージ
message User {
  string id = 1;
  string name = 2;
  string email = 3;
  bool email_verified = 4;
  optional string image = 5;
  string created_at = 6;
  string updated_at = 7;
  // secondaryStorage 経由で cookieCache に乗る revision 値。
  // VerifySession で DB の最新値と比較し、不一致なら REVISION_OUTDATED を返す。
  int32 revision = 8;

  // この user の現在の事業所 ID。SDK の companyId はこの値を返す。
  // 値がある時は、この user が今所属している ACTIVE な事業所のどれか 1 つの ID である。
  // ACTIVE な所属が 1 件も無い時だけ空になる。
  // 所属を失った事業所や削除された事業所を指したまま残らない。
  // 空の時、consumer は事業所未選択として扱う。
  // 対応 DB 列は `user.last_used_company_id` (proto field 名と異なる)。
  optional string default_company_id = 12;

  // 将来の AI 拡張用に field 番号を予約 (multi-tenant 関連は PR #55 で活性化済)
  reserved 9 to 11, 13 to 20;
  reserved "ai_consent_settings", "active_ai_clients",
           "tenant_id", "locale";
}

message Session {
  string id = 1;
  string expires_at = 3;
  // "user" | "admin" | "system" | "assumed" (現状は "user" 固定)。
  // 将来 Become / system session を実装した時点で拡張。
  string session_kind = 7;

  // PR #34 → #35: token/user_id は SDK で trim 済の dead field、ip_address/user_agent は
  // better-auth client が直接参照のため proto 経由不要。
  reserved 2, 4, 5, 6;
  reserved "token", "user_id", "ip_address", "user_agent";

  // 書き込む処理が無く、値は常に空。
  // 現在の事業所は User.default_company_id を使う。
  optional string company_id = 8;

  // 将来の AI / Become 用に field 番号を予約
  reserved 9 to 30;
  reserved "scopes", "actor_type",
           "client_id", "issued_for_ai",
           "become_admin_id", "original_user_id", "delegation_scope",
           "issued_at", "auth_method", "user_revision";
}

// AuthService メッセージ
message VerifySessionRequest {
  string session_token = 1;
}

// VerifySession の成功と失敗を proto の oneof で union 化。
// SDK 側で TypeScript の discriminated union として narrowing 可能。
message VerifySessionOk {
  User user = 1;
  Session session = 2;

  // User.default_company_id の事業所での、この user の role。SDK の role はこの値を返す。
  // default_company_id が空の時は空。
  // default_company_id があっても、user 行を読んだ後に除名されると空になりうる。
  // 空の時、consumer は権限なしとして扱う。
  optional Role current_role = 3;
}

message VerifySessionError {
  Result reason = 1;
}

message VerifySessionResponse {
  oneof outcome {
    VerifySessionOk ok = 1;
    VerifySessionError error = 2;
  }
}

// UserService メッセージ
message FindUserByEmailRequest {
  string email = 1;
}

message FindUserByEmailResponse {
  optional User user = 1;
}
