syntax = "proto3";
package auth.v1;

// 認証（セッション管理、OAuth、Magic Link）
service AuthService {
  rpc VerifySession(VerifySessionRequest) returns (VerifySessionResponse);
  rpc GetUser(GetUserRequest) returns (GetUserResponse);
  rpc FindAccountByUserId(FindAccountByUserIdRequest) returns (FindAccountByUserIdResponse);
  rpc SignOut(SignOutRequest) returns (SignOutResponse);
  rpc SendMagicLink(SendMagicLinkRequest) returns (SendMagicLinkResponse);
}

// ユーザー管理（user テーブルが auth-service DB に存在するため必要）
service UserService {
  rpc FindUserByEmail(FindUserByEmailRequest) returns (FindUserByEmailResponse);
  rpc FindUserById(FindUserByIdRequest) returns (FindUserByIdResponse);
  rpc UpdateUser(UpdateUserRequest) returns (UpdateUserResponse);
  rpc DeleteUser(DeleteUserRequest) returns (DeleteUserResponse);
}

// VerifySession の失敗理由を表現する enum。
// SESSION_EXPIRED / USER_LOCKED / REVOKED は現状到達不能、将来
// session.revoked_at / user lock を実装した時点で活性化する。
enum Result {
  RESULT_UNSPECIFIED = 0;
  RESULT_OK = 1;
  RESULT_SESSION_NOT_FOUND = 2;
  RESULT_SESSION_EXPIRED = 3;
  RESULT_USER_DELETED = 4;
  RESULT_USER_LOCKED = 5;
  RESULT_REVOKED = 6;
  RESULT_REVISION_OUTDATED = 7;
}

// 共通メッセージ
message User {
  string id = 1;
  string name = 2;
  string email = 3;
  bool email_verified = 4;
  optional string image = 5;
  string created_at = 6;
  string updated_at = 7;
  // secondaryStorage 経由で cookieCache に乗る revision 値。
  // VerifySession で DB の最新値と比較し、不一致なら REVISION_OUTDATED を返す。
  int32 revision = 8;

  // 将来の AI / multi-tenant 対応用に field 番号を予約
  reserved 9 to 20;
  reserved "ai_consent_settings", "active_ai_clients",
           "tenant_id", "default_company_id", "locale";
}

message Session {
  string id = 1;
  string expires_at = 3;
  // "user" | "admin" | "system" | "assumed" (現状は "user" 固定)。
  // 将来 Become / system session を実装した時点で拡張。
  string session_kind = 7;

  // ADR-006 D6: token/user_id は SDK で trim 済の dead field、ip_address/user_agent は
  // better-auth client が直接参照のため proto 経由不要。
  reserved 2, 4, 5, 6;
  reserved "token", "user_id", "ip_address", "user_agent";

  // 将来の AI / multi-tenant / Become 用に field 番号を予約
  reserved 8 to 30;
  reserved "company_id", "scopes", "actor_type",
           "client_id", "issued_for_ai",
           "become_admin_id", "original_user_id", "delegation_scope",
           "issued_at", "auth_method", "user_revision";
}

message Account {
  string id = 1;
  string account_id = 2;
  string provider_id = 3;
  string user_id = 4;
  optional string access_token = 5;
  optional string refresh_token = 6;
  optional string scope = 7;
}

// AuthService メッセージ
message VerifySessionRequest {
  string session_token = 1;
}

// VerifySession の成功と失敗を proto の oneof で union 化。
// SDK 側で TypeScript の discriminated union として narrowing 可能。
message VerifySessionOk {
  User user = 1;
  Session session = 2;
}

message VerifySessionError {
  Result reason = 1;
}

message VerifySessionResponse {
  oneof outcome {
    VerifySessionOk ok = 1;
    VerifySessionError error = 2;
  }
}

message GetUserRequest {
  string user_id = 1;
}

message GetUserResponse {
  optional User user = 1;
}

message FindAccountByUserIdRequest {
  string user_id = 1;
}

message FindAccountByUserIdResponse {
  optional Account account = 1;
}

message SignOutRequest {
  string session_token = 1;
}

message SignOutResponse {
  bool success = 1;
}

message SendMagicLinkRequest {
  string email = 1;
  string callback_url = 2;
}

message SendMagicLinkResponse {
  bool success = 1;
}

// UserService メッセージ
message FindUserByEmailRequest {
  string email = 1;
}

message FindUserByEmailResponse {
  optional User user = 1;
}

message FindUserByIdRequest {
  string user_id = 1;
}

message FindUserByIdResponse {
  optional User user = 1;
}

message UpdateUserRequest {
  string user_id = 1;
  optional string name = 2;
  optional string image = 3;
  bool clear_image = 4; // true で image を null に設定（clearImage 相当）
}

message UpdateUserResponse {
  User user = 1;
}

message DeleteUserRequest {
  string user_id = 1;
}

message DeleteUserResponse {
  bool success = 1;
}
