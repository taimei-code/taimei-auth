services:
  auth-postgres:
    image: postgres:16.8-alpine3.21
    ports:
      - "5435:5432"
    environment:
      POSTGRES_DB: auth
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    volumes:
      - auth-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  auth-redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  auth-service:
    build: .
    ports:
      - "3100:3100"
    environment:
      PORT: "3100"
      DATABASE_URL: postgres://postgres:password@auth-postgres:5432/auth
      REDIS_URL: redis://auth-redis:6379
      AUTH_SERVICE_URL: http://localhost:3100
      AUTH_COOKIE_DOMAIN: localhost
      AUTH_TRUSTED_ORIGINS: http://localhost:3000,http://localhost:3001
      APP_ENV: development
      APP_NAME: taimei
    depends_on:
      auth-postgres:
        condition: service_healthy
      auth-redis:
        condition: service_healthy
    develop:
      watch:
        - action: sync
          path: ./src
          target: /app/src
        - action: sync
          path: ./db
          target: /app/db
        - action: rebuild
          path: package.json

volumes:
  auth-postgres-data:
