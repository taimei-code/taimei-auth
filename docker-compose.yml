# taimei-auth (認証サーバー) を単独で起動するための compose。
# taimei (Next.js) と組み合わせる場合は、この compose を先に `docker compose up` してから
# taimei 側の docker-compose.yml を起動する。
# 共有ネットワーク `taimei-network` はこの compose が作成する。taimei 側は external として参照する。
# サブドメインをまたぐ Cookie (.taimei-code.local) を成立させるため、auth-service には
# network alias `auth.taimei-code.local` を付ける。

# APP_ENV を build args に渡す理由は、web/vite.config.ts が define で APP_ENV を bundle に
# 埋め込むため、build 時に値が決まっていないと Vite は "production" でビルドしてしまい、
# services.ts の isLocalEnv が false になって localhost と .local が allowlist で弾かれるからである。
x-dev-build: &dev-build
  context: .
  target: dev
  args:
    APP_ENV: development

networks:
  taimei-network:
    name: taimei-network
    driver: bridge

services:
  auth-postgres:
    image: postgres:16.8-alpine3.21
    ports:
      - "5435:5432"
    environment:
      POSTGRES_DB: auth
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    volumes:
      - auth-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - taimei-network

  # drizzle-kit migrate を起動のたびに実行する一回限りの service。
  # auth-service の起動を depends_on (service_completed_successfully) で待たせて、
  # schema が不整合のままサーバが起動して 500 を返すのを防ぐ。冪等なので毎回走らせて問題ない。
  auth-migrate:
    build: *dev-build
    # drizzle migrate (自動管理分) の後に、手動の trigger SQL (drizzle/manual/) を適用する。
    # trigger は drizzle-kit が管理しないため別のディレクトリに置く (db/CLAUDE.md ルール 8、PR #43)。
    # psql client を image に入れず、drizzle-orm の sql.raw で実行する (db/migrate-manual.ts)。
    command: ["sh", "-c", "bun run db:migrate && bun run db:migrate-manual"]
    environment:
      DATABASE_URL: postgres://postgres:password@auth-postgres:5432/auth
    depends_on:
      auth-postgres:
        condition: service_healthy
    networks:
      - taimei-network

  auth-service:
    build: *dev-build
    command: bash scripts/wrangler-dev.sh
    ports:
      - "3100:3100"
    env_file:
      - .env
    environment:
      PORT: "3100"
      DATABASE_URL: postgres://postgres:password@auth-postgres:5432/auth
      # taimei (app.taimei-code.local:3001) とのサブドメインをまたぐ Cookie を成立させるため、
      # localhost ではなく .taimei-code.local 系の host を使う。
      AUTH_SERVICE_URL: http://auth.taimei-code.local:3100
      AUTH_COOKIE_DOMAIN: taimei-code.local
      AUTH_TRUSTED_ORIGINS: http://app.taimei-code.local:3001,http://auth.taimei-code.local:3100
      # MFA の secret とリカバリーコードを暗号化する鍵の一覧 (形式と手順は README「MFA 暗号鍵」節で定義する)
      MFA_TOTP_ENCRYPTION_KEYS: ${MFA_TOTP_ENCRYPTION_KEYS}
      APP_ENV: development
      APP_NAME: taimei
      # taimei (application) と Cookie の署名検証を一致させるため、両方の compose に同じ開発用 secret を直接書いている。
      # 本番ではこの環境変数を docker-compose 経由ではなく、ホスト側の secret manager などで注入する。
      AUTH_SECRET: dev-secret-for-local-development-32chars
      # ConnectRPC の X-Service-Key の検証に使う。taimei application の AUTH_SERVICE_KEY と一致している必要がある。
      # .env 経由でも上書きできるが、両方の compose に同じ値を直接書いて、設定し忘れたまま検証が
      # 気付かれずに省略される (index.ts の AUTH_SERVICE_KEY 未設定時の経路に入る) のを防ぐ。
      AUTH_SERVICE_KEY: local-dev-key
      AUTH_SERVICE_KEY_PREVIOUS: ${AUTH_SERVICE_KEY_PREVIOUS:-}
    depends_on:
      auth-postgres:
        condition: service_healthy
      auth-migrate:
        condition: service_completed_successfully
    develop:
      watch:
        - action: sync
          path: ./src
          target: /app/src
        - action: sync
          path: ./db
          target: /app/db
        - action: rebuild
          path: package.json
        # advisory への対応では bun.lock だけが変わるため、package.json の trigger では rebuild が
        # 起きず、古い依存のまま QA してしまう。
        - action: rebuild
          path: bun.lock
    networks:
      taimei-network:
        aliases:
          - auth.taimei-code.local

volumes:
  auth-postgres-data:
