x-dev-build: &dev-build
  context: .
  target: dev

x-wrangler-state: &wrangler-state /wrangler-state

# taimei 側の compose が external として参照する
networks:
  taimei-network:
    name: taimei-network
    driver: bridge

services:
  auth-postgres:
    image: postgres:16.8-alpine3.21
    ports:
      - "5435:5432"
    environment:
      POSTGRES_DB: auth
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    volumes:
      - auth-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - taimei-network

  auth-migrate:
    build: *dev-build
    command: ["sh", "-c", "bun run db:migrate && bun run db:migrate-manual"]
    environment:
      DATABASE_URL: postgres://postgres:password@auth-postgres:5432/auth
    depends_on:
      auth-postgres:
        condition: service_healthy
    networks:
      - taimei-network

  auth-service:
    build: *dev-build
    command: ["bash", "scripts/wrangler-dev.sh", "--cwd", "testing", "--config", "wrangler.jsonc", "--persist-to", *wrangler-state, "dev-worker.ts"]
    volumes:
      - type: volume
        source: auth-wrangler-state
        target: *wrangler-state
    ports:
      - "3100:3100"
    env_file:
      - .env
      - packages/auth-client/testing/development-environment.env
      - packages/auth-client/testing/service-key.env
    environment:
      PORT: "3100"
      DATABASE_URL: postgres://postgres:password@auth-postgres:5432/auth
      MFA_TOTP_ENCRYPTION_KEYS: ${MFA_TOTP_ENCRYPTION_KEYS}
      APP_ENV: development
      APP_NAME: taimei
      # taimei 側の compose と同じ値にする (Cookie の署名検証を一致させる)
      AUTH_SECRET: dev-secret-for-local-development-32chars
      AUTH_SERVICE_KEY_PREVIOUS: ${AUTH_SERVICE_KEY_PREVIOUS:-}
    depends_on:
      auth-postgres:
        condition: service_healthy
      auth-migrate:
        condition: service_completed_successfully
    develop:
      watch:
        - action: sync
          path: ./src
          target: /app/src
        - action: sync
          path: ./db
          target: /app/db
        - action: sync
          path: ./testing
          target: /app/testing
        - action: rebuild
          path: package.json
        # advisory 対応では bun.lock だけが変わり package.json の trigger では rebuild が起きない
        - action: rebuild
          path: bun.lock
    networks:
      taimei-network:
        aliases:
          - auth.taimei-code.localhost

volumes:
  auth-postgres-data:
  auth-wrangler-state:
