# APP_ENV は web/vite.config.ts が define で bundle に埋め込むため build args で渡す (無いと "production" で build され、services.ts の isLocalEnv が false になって localhost と .local が allowlist で弾かれる)
x-dev-build: &dev-build
  context: .
  target: dev
  args:
    APP_ENV: development

# taimei 側の compose が external として参照する
networks:
  taimei-network:
    name: taimei-network
    driver: bridge

services:
  auth-postgres:
    image: postgres:16.8-alpine3.21
    ports:
      - "5435:5432"
    environment:
      POSTGRES_DB: auth
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    volumes:
      - auth-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - taimei-network

  auth-migrate:
    build: *dev-build
    command: ["sh", "-c", "bun run db:migrate && bun run db:migrate-manual"]
    environment:
      DATABASE_URL: postgres://postgres:password@auth-postgres:5432/auth
    depends_on:
      auth-postgres:
        condition: service_healthy
    networks:
      - taimei-network

  auth-service:
    build: *dev-build
    command: bash scripts/wrangler-dev.sh
    ports:
      - "3100:3100"
    env_file:
      - .env
    environment:
      PORT: "3100"
      DATABASE_URL: postgres://postgres:password@auth-postgres:5432/auth
      # taimei (app.taimei-code.local:3001) とサブドメインをまたぐ Cookie を成立させるため localhost でなく .taimei-code.local の host を使う
      AUTH_SERVICE_URL: http://auth.taimei-code.local:3100
      AUTH_COOKIE_DOMAIN: taimei-code.local
      AUTH_TRUSTED_ORIGINS: http://app.taimei-code.local:3001,http://auth.taimei-code.local:3100
      MFA_TOTP_ENCRYPTION_KEYS: ${MFA_TOTP_ENCRYPTION_KEYS}
      APP_ENV: development
      APP_NAME: taimei
      # taimei 側の compose と同じ値にする (Cookie の署名検証を一致させる)
      AUTH_SECRET: dev-secret-for-local-development-32chars
      # taimei 側の AUTH_SERVICE_KEY と同じ値にする。.env 任せにすると設定し忘れたまま検証が省略される経路に入るため直接書く
      AUTH_SERVICE_KEY: local-dev-key
      AUTH_SERVICE_KEY_PREVIOUS: ${AUTH_SERVICE_KEY_PREVIOUS:-}
    depends_on:
      auth-postgres:
        condition: service_healthy
      auth-migrate:
        condition: service_completed_successfully
    develop:
      watch:
        - action: sync
          path: ./src
          target: /app/src
        - action: sync
          path: ./db
          target: /app/db
        - action: rebuild
          path: package.json
        # advisory 対応では bun.lock だけが変わり package.json の trigger では rebuild が起きない
        - action: rebuild
          path: bun.lock
    networks:
      taimei-network:
        aliases:
          - auth.taimei-code.local

volumes:
  auth-postgres-data:
