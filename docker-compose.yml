# taimei-auth (認証サーバー) を独立起動するための compose。
# taimei (Next.js) と組み合わせる場合は、本 compose を先に `docker compose up` してから
# taimei 側の docker-compose.yml を起動する。
# 共有ネットワーク `taimei-network` は本 compose が作成主 (define)。taimei 側は external 参照。
# cross-subdomain Cookie (.taimei-code.local) を成立させるため、auth-service には
# network alias `auth.taimei-code.local` を付与する。

networks:
  taimei-network:
    name: taimei-network
    driver: bridge

services:
  auth-postgres:
    image: postgres:16.8-alpine3.21
    ports:
      - "5435:5432"
    environment:
      POSTGRES_DB: auth
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    volumes:
      - auth-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - taimei-network

  auth-redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - taimei-network

  # drizzle-kit migrate を起動毎に実行する one-shot service。
  # auth-service の起動を depends_on (service_completed_successfully) で待たせて、
  # schema 不整合時のサーバ起動 → 500 を防ぐ。idempotent なので毎回走らせて問題ない。
  auth-migrate:
    build:
      context: .
      args:
        APP_ENV: development
    # drizzle migrate (auto-managed) → manual trigger SQL (drizzle/manual/) の順に適用。
    # trigger は drizzle-kit が管理しないため別 dir に置く (ADR-001 R1 + MECE I7)。
    # psql client を image に入れず、drizzle-orm の sql.raw で実行する (db/migrate-manual.ts)。
    command: ["sh", "-c", "bun run db:migrate && bun run db:migrate-manual"]
    environment:
      DATABASE_URL: postgres://postgres:password@auth-postgres:5432/auth
    depends_on:
      auth-postgres:
        condition: service_healthy
    networks:
      - taimei-network

  auth-service:
    # APP_ENV を build args に渡す理由: web/vite.config.ts が define で APP_ENV を bundle に
    # 埋め込むため、build 時に値が決まっていないと Vite は "production" でビルドしてしまい
    # services.ts の isLocalEnv が false になり localhost / .local が allowlist で弾かれる。
    build:
      context: .
      args:
        APP_ENV: development
    ports:
      - "3100:3100"
    env_file:
      - .env
    environment:
      PORT: "3100"
      DATABASE_URL: postgres://postgres:password@auth-postgres:5432/auth
      REDIS_URL: redis://auth-redis:6379
      # taimei (app.taimei-code.local:3001) との cross-subdomain Cookie を成立させるため、
      # localhost ではなく .taimei-code.local 系の host を採用する。
      AUTH_SERVICE_URL: http://auth.taimei-code.local:3100
      AUTH_COOKIE_DOMAIN: taimei-code.local
      AUTH_TRUSTED_ORIGINS: http://app.taimei-code.local:3001,http://auth.taimei-code.local:3100
      APP_ENV: development
      APP_NAME: taimei
      # taimei (application) と Cookie 署名検証を一致させるため、両 compose で同じ dev secret を hardcoded。
      # 本番はこの環境変数を docker-compose 経由ではなくホスト側の secret manager 等で注入すること。
      AUTH_SECRET: dev-secret-for-local-development-32chars
      # ConnectRPC の X-Service-Key 検証用。taimei application の AUTH_SERVICE_KEY と一致必須。
      # .env 経由でも上書き可能だが、両 compose で対称に hardcoded して「設定し忘れ → silent skip」
      # (index.ts の AUTH_SERVICE_KEY 未設定時パスに入る) を防ぐ。
      AUTH_SERVICE_KEY: local-dev-key
      AUTH_SERVICE_KEY_PREVIOUS: ${AUTH_SERVICE_KEY_PREVIOUS:-}
    depends_on:
      auth-postgres:
        condition: service_healthy
      auth-redis:
        condition: service_healthy
      auth-migrate:
        condition: service_completed_successfully
    develop:
      watch:
        - action: sync
          path: ./src
          target: /app/src
        - action: sync
          path: ./db
          target: /app/db
        - action: rebuild
          path: package.json
    networks:
      taimei-network:
        aliases:
          - auth.taimei-code.local

volumes:
  auth-postgres-data:
