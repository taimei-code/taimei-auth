version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    ignore:
      # effect の RC は 2〜5 日周期で publish され、追従 PR が minimumReleaseAge (7 日) で止まって CI が落ちる。stable 4.0.0 が出たら外す
      - dependency-name: "effect"
        versions: ["< 4.0.0"]
    groups:
      dev-dependencies:
        dependency-type: "development"
