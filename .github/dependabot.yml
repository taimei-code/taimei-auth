version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    # bunfig.toml の minimumReleaseAge (7 日) に揃える。7 日未満の版の PR は install で落ちる
    cooldown:
      default-days: 7
    groups:
      dev-dependencies:
        dependency-type: "development"
      react-email:
        patterns:
          - "@react-email/*"
