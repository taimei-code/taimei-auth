version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      # @effect/tsgo は対応する typescript の版を狭く決めているので、一緒に上げる
      typescript:
        patterns:
          - "typescript"
          - "@effect/tsgo"
      dev-dependencies:
        dependency-type: "development"
