name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  staging:
    if: (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    concurrency:
      group: deploy-staging
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Prepare staging
        uses: ./.github/actions/prepare-staging
        with:
          database-url: ${{ secrets.DATABASE_URL }}

      - name: Gate deploy to staging
        uses: ./.github/actions/gate-deploy
        with:
          stage: staging
          worker-name: taimei-auth-staging
          base-url: https://taimei-auth-staging.taimei-staging.workers.dev
          smoke: access
          cloudflare-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          cloudflare-account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          access-client-id: ${{ secrets.ACCESS_CLIENT_ID }}
          access-client-secret: ${{ secrets.ACCESS_CLIENT_SECRET }}

  deploy:
    needs: staging
    if: (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3"

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Build production in a tree without non-production code
        run: bash scripts/build-production-tree.sh "${{ runner.temp }}/production-tree"

      # DATABASE_URL は Neon の直接接続文字列 (Hyperdrive 経由でなく DDL 用)
      - name: Apply migrations (drizzle/*.sql があれば)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if ls drizzle/*.sql >/dev/null 2>&1; then
            echo "migration files found -> applying (db:migrate + db:migrate-manual)"
            bun run db:migrate
            bun run db:migrate-manual
          else
            echo "no migration files under drizzle/ -> skip"
          fi

      - name: Gate deploy to production
        uses: ./.github/actions/gate-deploy
        with:
          stage: production
          worker-name: taimei-auth
          base-url: https://auth.taimei-code.com
          directory: ${{ runner.temp }}/production-tree
          smoke: public
          cloudflare-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          cloudflare-account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
