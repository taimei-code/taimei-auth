name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3"

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      # wrangler の bundle が @taimei-code/auth-client を dist 経由で解決するため先に build する
      - name: Build auth-client SDK
        working-directory: packages/auth-client
        run: bun run build

      - name: Build web SPA
        run: bun run build:web

      # DATABASE_URL は Neon の直接接続文字列 (Hyperdrive 経由でなく DDL 用)
      - name: Apply migrations (drizzle/*.sql があれば)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if ls drizzle/*.sql >/dev/null 2>&1; then
            echo "migration files found -> applying (db:migrate + db:migrate-manual)"
            bun run db:migrate
            bun run db:migrate-manual
          else
            echo "no migration files under drizzle/ -> skip"
          fi

      # DO の migrations を含む version は versions upload では上げられない。その時だけ手元で `wrangler deploy` する
      - name: Upload Worker version (not yet deployed)
        id: upload
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          bunx wrangler versions upload --tag "ci-${GITHUB_SHA::7}" --message "deploy.yml ${GITHUB_RUN_ID}" | tee upload.log
          version_id=$(sed -n 's/^Worker Version ID: *//p' upload.log | tr -d '[:space:]')
          [ -n "$version_id" ] || { echo "version id not found in wrangler output" >&2; exit 1; }
          echo "version_id=$version_id" >> "$GITHUB_OUTPUT"

      # override header は deployment に含まれる version にしか効かないため、0% で加えておく
      - name: Stage version at 0% traffic
        id: stage
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VERSION_ID: ${{ steps.upload.outputs.version_id }}
        run: |
          set -euo pipefail
          current=$(bunx wrangler deployments status | sed -n 's/.*(100%) *//p' | tr -d '[:space:]')
          [ -n "$current" ] || { echo "current 100% version not found in deployments status" >&2; exit 1; }
          echo "current_id=$current" >> "$GITHUB_OUTPUT"
          bunx wrangler versions deploy "${VERSION_ID}@0%" "${current}@100%" --yes --message "deploy.yml ${GITHUB_RUN_ID} stage (${GITHUB_SHA::7})"

      - name: Smoke new version via override header (gate)
        env:
          VERSION_ID: ${{ steps.upload.outputs.version_id }}
        run: bash scripts/preview-smoke.sh https://auth.taimei-code.com "$VERSION_ID"

      - name: Restore previous version on smoke failure
        if: failure() && steps.stage.outcome == 'success'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CURRENT_ID: ${{ steps.stage.outputs.current_id }}
        run: bunx wrangler versions deploy "${CURRENT_ID}@100%" --yes --message "deploy.yml ${GITHUB_RUN_ID} restore after smoke failure"

      - name: Deploy version to production traffic
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VERSION_ID: ${{ steps.upload.outputs.version_id }}
        run: bunx wrangler versions deploy "${VERSION_ID}@100%" --yes --message "deploy.yml ${GITHUB_RUN_ID} (${GITHUB_SHA::7})"
