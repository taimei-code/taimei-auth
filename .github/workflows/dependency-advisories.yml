name: Dependency advisories

on:
  schedule:
    - cron: "41 0 * * *"
  workflow_dispatch:

concurrency:
  group: dependency-advisories
  cancel-in-progress: false

jobs:
  report:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4"

      - name: Report every advisory to the dependency-advisories issue
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bun audit --json | bun scripts/report-advisories.ts
