name: Publish auth-client to GitHub Packages

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publish-auth-client
  cancel-in-progress: false

jobs:
  publish:
    if: (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: write # tag の push に要る
      packages: write

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}
          fetch-depth: 0 # 既存の tag で再 publish を guard する

      - name: Resolve version and guard against re-publish
        id: ver
        run: |
          VERSION=$(node -p "require('./packages/auth-client/package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git rev-parse "auth-client-v$VERSION" >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "::notice::auth-client-v$VERSION は既に publish 済み。skip します。"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        if: steps.ver.outputs.published == 'false'
        with:
          node-version: "20"
          registry-url: "https://npm.pkg.github.com"
          scope: "@taimei-code" # GitHub Packages の制約で org の login と同じにする

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: steps.ver.outputs.published == 'false'
        with:
          bun-version: "1.3"

      - name: Install dependencies (workspace root)
        if: steps.ver.outputs.published == 'false'
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Build auth-client
        if: steps.ver.outputs.published == 'false'
        working-directory: packages/auth-client
        run: bun run build

      - name: Build the testing image with the SDK version
        if: steps.ver.outputs.published == 'false'
        env:
          IMAGE: ghcr.io/taimei-code/taimei-auth-testing:auth-client-v${{ steps.ver.outputs.version }}
        run: |
          docker build --target dev \
            --label org.opencontainers.image.source=https://github.com/${{ github.repository }} \
            -t "$IMAGE" .
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Assert no proxy CA in /opt/certs or /app/certs of the testing image
        if: steps.ver.outputs.published == 'false'
        run: docker run --rm --entrypoint sh "$IMAGE" -c 'test -z "$(find /opt/certs /app/certs -type f ! -name .gitkeep)"'

      - name: Start the testing image with the compose fragment and sign in with the testing client
        if: steps.ver.outputs.published == 'false'
        run: bash scripts/testing-image-smoke.sh "$IMAGE"

      - name: Push the testing image and read its digest
        if: steps.ver.outputs.published == 'false'
        id: image
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GITHUB_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "$IMAGE"
          echo "image_with_digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE")" >> "$GITHUB_OUTPUT"

      - name: Generate the testing compose fragment after the image build
        if: steps.ver.outputs.published == 'false'
        run: bash scripts/generate-testing-fragment.sh "${{ steps.image.outputs.image_with_digest }}" > packages/auth-client/testing/compose.yml

      # bun publish でなく npm publish (認証が setup-node の生成する .npmrc と NODE_AUTH_TOKEN に依存する)
      - name: Publish to GitHub Packages
        if: steps.ver.outputs.published == 'false'
        working-directory: packages/auth-client
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag release
        if: steps.ver.outputs.published == 'false'
        run: |
          git tag "auth-client-v${{ steps.ver.outputs.version }}"
          git push origin "auth-client-v${{ steps.ver.outputs.version }}"
