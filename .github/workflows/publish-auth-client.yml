name: Publish auth-client to GitHub Packages

# packages/auth-client/package.json の version を上げた PR が main にマージされると自動で publish する。
# version を読み取り、同名の tag (auth-client-v<version>) がまだ無ければ build して publish し、記録のために tag を打つ。
# tag の有無を冪等性の guard にしているため、同じ version で再実行しても二重に publish しない。
# scope の @taimei-code (GitHub org の login と同じ) は GitHub Packages の owner の制約に合わせている。
# 手動で publish する必要がある場合は workflow_dispatch から実行する。
on:
  push:
    branches:
      - main
    paths:
      - "packages/auth-client/package.json"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # publish 後に tag を push するために必要
      packages: write

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0 # version の重複を guard するため、既存の tag をすべて取得する

      - name: Resolve version and guard against re-publish
        id: ver
        run: |
          VERSION=$(node -p "require('./packages/auth-client/package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git rev-parse "auth-client-v$VERSION" >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "::notice::auth-client-v$VERSION は既に publish 済み。skip します。"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      # actions/setup-node の registry-url と scope が .npmrc を自動生成し、
      # NODE_AUTH_TOKEN を Bearer token として GitHub Packages の認証に使う。
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        if: steps.ver.outputs.published == 'false'
        with:
          node-version: "20"
          registry-url: "https://npm.pkg.github.com"
          scope: "@taimei-code"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: steps.ver.outputs.published == 'false'
        with:
          bun-version: "1.3"

      - name: Install dependencies (workspace root)
        if: steps.ver.outputs.published == 'false'
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Build auth-client
        if: steps.ver.outputs.published == 'false'
        working-directory: packages/auth-client
        run: bun run build

      # npm publish を選ぶ理由は、GitHub Packages との互換性が安定しているからである。bun publish も Bun 1.3 以降で動くが、
      # registry の認証経路が actions/setup-node の生成する .npmrc に強く依存するため、npm CLI で実装する。
      - name: Publish to GitHub Packages
        if: steps.ver.outputs.published == 'false'
        working-directory: packages/auth-client
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag release
        if: steps.ver.outputs.published == 'false'
        run: |
          git tag "auth-client-v${{ steps.ver.outputs.version }}"
          git push origin "auth-client-v${{ steps.ver.outputs.version }}"
