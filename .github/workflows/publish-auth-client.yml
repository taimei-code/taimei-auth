name: Publish auth-client to GitHub Packages

# packages/auth-client/package.json の version を bump した PR が main にマージされると自動 publish。
# version を読み取り、同名 tag (auth-client-v<version>) が未作成なら build & publish し、記録用に tag を打つ。
# tag の有無を idempotency guard にするため、同じ version で再 run しても二重 publish しない。
# scope @taimei-code (= GitHub org login) と GitHub Packages の owner 制約に整合。
# 手動 publish が必要な場合は workflow_dispatch から実行する。
on:
  push:
    branches:
      - main
    paths:
      - "packages/auth-client/package.json"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # publish 後の tag push に必要
      packages: write

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0 # 既存 tag 全取得 (version 重複 guard のため)

      - name: Resolve version and guard against re-publish
        id: ver
        run: |
          VERSION=$(node -p "require('./packages/auth-client/package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git rev-parse "auth-client-v$VERSION" >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "::notice::auth-client-v$VERSION は既に publish 済み。skip します。"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      # actions/setup-node の registry-url + scope は .npmrc を自動生成し、
      # NODE_AUTH_TOKEN を Bearer として GitHub Packages 認証に使う。
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: steps.ver.outputs.published == 'false'
        with:
          node-version: "20"
          registry-url: "https://npm.pkg.github.com"
          scope: "@taimei-code"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: steps.ver.outputs.published == 'false'
        with:
          bun-version: "1.3"

      - name: Install dependencies (workspace root)
        if: steps.ver.outputs.published == 'false'
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Build auth-client
        if: steps.ver.outputs.published == 'false'
        working-directory: packages/auth-client
        run: bun run build

      # npm publish を選ぶ理由: GitHub Packages 互換性が枯れている。bun publish も Bun 1.3+ で動作するが、
      # registry 認証経路が actions/setup-node 生成 .npmrc に強く依存するため、npm CLI で実装する。
      - name: Publish to GitHub Packages
        if: steps.ver.outputs.published == 'false'
        working-directory: packages/auth-client
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag release
        if: steps.ver.outputs.published == 'false'
        run: |
          git tag "auth-client-v${{ steps.ver.outputs.version }}"
          git push origin "auth-client-v${{ steps.ver.outputs.version }}"
