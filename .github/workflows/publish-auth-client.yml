name: Publish auth-client to GitHub Packages

# tag `auth-client-v*` push でトリガ。
# scope `@taimei-code` (= GitHub org login) と GitHub Packages の owner 制約に整合。
# 認証は GITHUB_TOKEN で完結 (organization 内パッケージなので packages: write 権限のみで足りる)。

on:
  push:
    tags:
      - "auth-client-v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # actions/setup-node の registry-url + scope は .npmrc を自動生成し、
      # NODE_AUTH_TOKEN を Bearer として GitHub Packages 認証に使う。
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          registry-url: "https://npm.pkg.github.com"
          scope: "@taimei-code"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3"

      - name: Install dependencies (workspace root)
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Build auth-client
        working-directory: packages/auth-client
        run: bun run build

      # npm publish を選ぶ理由: GitHub Packages 互換性が枯れている。bun publish も Bun 1.3+ で動作するが、
      # registry 認証経路が actions/setup-node 生成 .npmrc に強く依存するため、初回は npm CLI で実装する。
      - name: Publish to GitHub Packages
        working-directory: packages/auth-client
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
