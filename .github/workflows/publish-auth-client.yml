name: Publish auth-client to GitHub Packages

on:
  push:
    branches:
      - main
    paths:
      - "packages/auth-client/package.json"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # tag の push に要る
      packages: write

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0 # 既存の tag で再 publish を guard する

      - name: Resolve version and guard against re-publish
        id: ver
        run: |
          VERSION=$(node -p "require('./packages/auth-client/package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git rev-parse "auth-client-v$VERSION" >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "::notice::auth-client-v$VERSION は既に publish 済み。skip します。"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        if: steps.ver.outputs.published == 'false'
        with:
          node-version: "20"
          registry-url: "https://npm.pkg.github.com"
          scope: "@taimei-code" # GitHub Packages の制約で org の login と同じにする

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: steps.ver.outputs.published == 'false'
        with:
          bun-version: "1.3"

      - name: Install dependencies (workspace root)
        if: steps.ver.outputs.published == 'false'
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Build auth-client
        if: steps.ver.outputs.published == 'false'
        working-directory: packages/auth-client
        run: bun run build

      # 試験用の image は SDK と同じ版で出し、SDK の断片はその digest を参照する (consumer が固定する版を SDK の 1 つにする)
      - name: Build and push the testing image
        if: steps.ver.outputs.published == 'false'
        id: image
        env:
          IMAGE: ghcr.io/taimei-code/taimei-auth-testing:auth-client-v${{ steps.ver.outputs.version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          docker build --target dev --build-arg APP_ENV=test \
            --label org.opencontainers.image.source=https://github.com/${{ github.repository }} \
            -t "$IMAGE" .
          docker run --rm --entrypoint sh "$IMAGE" -c 'test ! -e /opt/certs/palo-root.pem'
          echo "$GITHUB_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "$IMAGE"
          echo "pinned=$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE")" >> "$GITHUB_OUTPUT"

      - name: Stamp the testing compose fragment
        if: steps.ver.outputs.published == 'false'
        run: bun run scripts/stamp-testing-fragment.ts "${{ steps.image.outputs.pinned }}"

      # bun publish でなく npm publish (認証が setup-node の生成する .npmrc と NODE_AUTH_TOKEN に依存する)
      - name: Publish to GitHub Packages
        if: steps.ver.outputs.published == 'false'
        working-directory: packages/auth-client
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag release
        if: steps.ver.outputs.published == 'false'
        run: |
          git tag "auth-client-v${{ steps.ver.outputs.version }}"
          git push origin "auth-client-v${{ steps.ver.outputs.version }}"
