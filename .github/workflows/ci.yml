name: CI

on:
  pull_request:
  push:
    branches:
      - main

# main への push は打ち切らない (deploy.yml が CI の run 全体の conclusion を gate にしている)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16.8-alpine3.21
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: auth
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://postgres:password@localhost:5432/auth

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0 # fallow audit が origin/main との merge-base を必要とする

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3"

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      # GHSA-qwww-vcr4-c8h2 (react-router RSC Mode の CSRF) は修正が 8.x のみで、このリポジトリは RSC Mode を使わない。v8 へ上げるか 7.x の backport が出たら外す
      - name: Audit dependencies
        run: bun audit --audit-level=high --ignore=GHSA-qwww-vcr4-c8h2

      # typecheck が SDK の dist/*.d.ts を解決するため先に build する
      - name: Build auth-client SDK
        working-directory: packages/auth-client
        run: bun run build

      - name: Lint (Biome + fallow audit)
        run: bun run lint

      - name: Lint (shellcheck)
        run: shellcheck scripts/*.sh e2e/*.sh

      - name: Assert generated proto copies are identical
        run: bun run generate:check

      - name: Assert worker-configuration.d.ts is up to date
        run: bun run types:check

      - name: Typecheck
        run: bun run typecheck

      # shallow clone に main の ref が無いため remote URL 経由で参照する。意図的に breaking にする時は SDK の major を上げ、一時的に --against を外す
      - name: Buf breaking check
        run: bunx @bufbuild/buf breaking --against "https://github.com/${{ github.repository }}.git#branch=main"

      - name: Apply migrations
        run: bun run db:migrate && bun run db:migrate-manual

      - name: Test
        run: bun test

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16.8-alpine3.21
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: auth
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://postgres:password@localhost:5432/auth

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3"

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Build auth-client SDK
        working-directory: packages/auth-client
        run: bun run build

      - name: Install Playwright browser
        run: bunx playwright install --with-deps chromium

      - name: Apply migrations
        run: bun run db:migrate && bun run db:migrate-manual

      - name: E2E test
        run: bun run test:e2e

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read

    # docker-smoke.sh dev が末尾に出す assert 件数。script の assert や probe 対象 (auth-client の exports キー) を増減したら更新する
    env:
      EXPECTED_DEV_ASSERTS: "21"

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create sentinels and leak canaries
        run: bash scripts/docker-smoke.sh seed

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # load: true は buildx の docker-container driver が image を local store に入れないため要る (後続の docker run と inspect が見つけられない)
      # context: . を省くと Git context になり、gitignore された sentinel が build に入らず不在 assert が中身の無い成功になる
      # provenance / sbom が付くと image ID が分かれ、位置契約 (既定 == --target dev) の assert が壊れる
      - name: Build (既定 target)
        id: build-default
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          load: true
          tags: smoke-dev
          provenance: false
          sbom: false
          cache-from: type=gha,scope=dev

      # この image は imageid の出力しか使わないため load を省く (1GB 級の export / import が消える)
      - name: Build (--target dev)
        id: build-dev
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          target: dev
          outputs: type=image,push=false
          tags: smoke-dev-explicit
          provenance: false
          sbom: false
          cache-from: type=gha,scope=dev
          cache-to: type=gha,scope=dev,mode=min

      - name: Build (--target dev / APP_ENV=development)
        id: build-dev-devenv
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          target: dev
          build-args: APP_ENV=development
          load: true
          tags: smoke-dev-devenv
          provenance: false
          sbom: false
          cache-from: type=gha,scope=dev

      - name: Assert 既定 target == dev stage
        run: |
          default_id='${{ steps.build-default.outputs.imageid }}'
          dev_id='${{ steps.build-dev.outputs.imageid }}'
          echo "既定 build: $default_id"
          echo "--target dev: $dev_id"
          if [ -z "$default_id" ] || [ -z "$dev_id" ]; then
            echo "::error::image ID を取得できなかった (既定=${default_id:-none} / --target dev=${dev_id:-none})。build step の outputs.imageid を確認する。"
            exit 1
          fi
          if [ "$default_id" != "$dev_id" ]; then
            echo "::error::位置契約違反: dev must be the final stage. 既定 build と --target dev の image ID が一致しない。Dockerfile 末尾の stage が dev 以外になっていないか確認する (詳細: docs/adr/0014-docker-runner-dev-stage-separation.md)。"
            exit 1
          fi

      - name: Assert APP_ENV=development が SPA build 成果物に反映されている
        run: |
          docker run --rm --network none -w /app smoke-dev-devenv cat web/dist/build-info.json \
            | grep -F '"appEnv":"development"'
          docker run --rm --network none -w /app smoke-dev cat web/dist/build-info.json \
            | grep -F '"appEnv":"production"'

      - name: Smoke (dev image)
        run: |
          smoke_status=0
          output=$(bash scripts/docker-smoke.sh dev smoke-dev) || smoke_status=$?
          echo "$output"
          # FAIL 行を件数の突き合わせより先に出す (逆順だと assert を増やした PR で件数不一致が先に出て本当の契約違反が annotation から消える)
          if [ "$smoke_status" -ne 0 ]; then
            printf '%s\n' "$output" | sed -n 's/^FAIL: /::error::docker-smoke.sh dev: /p'
            echo "::error::docker-smoke.sh dev が失敗した (exit=$smoke_status)。上の FAIL 行が契約違反の内訳 (詳細: docs/adr/0014-docker-runner-dev-stage-separation.md)。"
            exit "$smoke_status"
          fi
          count=$(printf '%s\n' "$output" | sed -n 's/^asserts executed: //p')
          if [ "$count" != "$EXPECTED_DEV_ASSERTS" ]; then
            echo "::error::docker-smoke.sh dev の実行 assert 件数が期待値と不一致 (実行=${count:-none} / 期待=$EXPECTED_DEV_ASSERTS)。script の assert 増減に合わせて本 job の EXPECTED_DEV_ASSERTS を更新する。"
            exit 1
          fi
