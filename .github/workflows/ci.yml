name: CI

# PR / main push で lint + typecheck + test を回す。
# 1 job に集約する理由: bun install が支配的なコストで、3 job に分けると並列化メリットより
# install 3 回の方が遅くなる。setup-bun が node_modules cache を持つようになったら分割を再検討。

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # db/__tests__/user-revision.test.ts が DB trigger を runtime で検証するため、
    # CI で postgres service を起動して migrate 適用後にテストを回す。
    # src/__tests__/rate-limit.test.ts が Redis MULTI を runtime で検証するため redis service も必須。
    services:
      postgres:
        image: postgres:16.8-alpine3.21
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: auth
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://postgres:password@localhost:5432/auth
      REDIS_URL: redis://localhost:6379

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3"

      # --ignore-scripts: install lifecycle 経由の任意コード実行を封じる (ADR-0009 C)。
      # bun の default は trustedDependencies のみ実行だが多重防御として明示。
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Audit dependencies
        run: bun audit --audit-level=high

      # taimei-auth (root) が `@taimei-code/auth-client` を workspace dep として import するため、
      # SDK の dist/*.d.ts を typecheck より先に build しておく必要がある (ADR-006 D3 dogfooding)。
      - name: Build auth-client SDK
        working-directory: packages/auth-client
        run: bun run build

      - name: Lint (Biome)
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      # proto wire 互換性を機械的に強制。
      # main ブランチを baseline として、本 PR の proto 変更が breaking でないことを CI で検証する。
      # 意図的な breaking が必要な場合は CHANGELOG 明記 + SDK major bump + 一時的に --against スキップで対応。
      # GitHub Actions の shallow clone で main ref が無いため、remote URL 経由で参照する。
      - name: Buf breaking check
        run: bunx @bufbuild/buf breaking --against "https://github.com/${{ github.repository }}.git#branch=main"

      # drizzle/0000 + 0001 + drizzle/manual/0001 trigger を順次適用。
      # db/__tests__/user-revision.test.ts が trigger 挙動を検証するため必須。
      - name: Apply migrations
        run: bun run db:migrate && bun run db:migrate-manual

      - name: Test
        run: bun test
