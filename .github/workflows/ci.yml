name: CI

# PR / main push で lint + typecheck + test を回す。
# 1 job に集約する理由: bun install が支配的なコストで、3 job に分けると並列化メリットより
# install 3 回の方が遅くなる。setup-bun が node_modules cache を持つようになったら分割を再検討。

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint (Biome)
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test
