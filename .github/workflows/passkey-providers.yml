name: Passkey providers

on:
  schedule:
    - cron: "53 0 * * 1"
  workflow_dispatch:

concurrency:
  group: passkey-providers
  cancel-in-progress: false

jobs:
  report:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3"

      - name: Report the passkey provider table check to the passkey-providers issue
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bun --print "JSON.stringify(require('./src/passkey/passkey-providers.ts').PASSKEY_PROVIDERS)" | bun scripts/report-passkey-providers.ts
