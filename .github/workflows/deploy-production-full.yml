name: Deploy production at 100%
run-name: "Production at 100% (${{ github.ref_name }}): no smoke gate, for Durable Object changes, cannot roll back to a version before the change"

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3"

      - name: Build production in a tree without non-production code
        run: bash scripts/build-production-tree.sh "${{ runner.temp }}/production-tree"

      - name: Deploy production at 100% with alchemy from the production tree
        working-directory: ${{ runner.temp }}/production-tree
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DEPLOY_MODE: full
          ALCHEMY_TELEMETRY_DISABLED: "1"
        run: bunx alchemy deploy infra/alchemy.run.ts --stage production --yes --no-input

      - name: Find the version at 100%
        id: version
        working-directory: ${{ runner.temp }}/production-tree
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          version_id=$(bash scripts/current-version-id.sh taimei-auth)
          echo "version_id=$version_id" >> "$GITHUB_OUTPUT"

      - name: Smoke production
        env:
          VERSION_ID: ${{ steps.version.outputs.version_id }}
        run: bash scripts/preview-smoke.sh https://auth.taimei-code.com taimei-auth "$VERSION_ID" public
