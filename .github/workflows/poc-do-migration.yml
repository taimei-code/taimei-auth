name: PoC DO migration

on:
  push:
    branches: [poc/2026-10-24-non-production-separation]
    paths: [poc/q5/**, .github/workflows/poc-do-migration.yml]

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3"
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bash poc/q5/run.sh
      - name: Delete the disposable worker
        if: always()
        run: bunx wrangler delete -c poc/q5/wrangler-v2.jsonc --force
