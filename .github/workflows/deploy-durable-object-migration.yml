name: Deploy Durable Object migration
run-name: "DO migration (${{ github.ref_name }}): no smoke gate, cannot roll back to a version before the migration"

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  migrate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3"

      - name: Build production in a tree without non-production code
        run: bash scripts/build-production-tree.sh "${{ runner.temp }}/production-tree"

      - name: Apply the Durable Object migration with wrangler deploy (smoke gate を通らず、適用後は前の version へ戻せない)
        working-directory: ${{ runner.temp }}/production-tree
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bunx wrangler deploy --message "deploy-durable-object-migration.yml ${GITHUB_RUN_ID}"
