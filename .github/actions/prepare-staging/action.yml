name: Prepare staging
description: Build the staging bundle from the non-production entry, apply migrations to the staging DB, and prepare the non-production tables and the development accounts.

inputs:
  database-url:
    description: Direct connection string of the staging DB owner
    required: true

runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: "1.3"

    - name: Install dependencies
      shell: bash
      run: bun install --frozen-lockfile --ignore-scripts

    - name: Build the staging bundle from the non-production entry
      shell: bash
      run: bash scripts/build-staging-bundle.sh

    - name: Stop unless the DB has the non-production mark
      shell: bash
      env:
        DATABASE_URL: ${{ inputs.database-url }}
      run: bun testing/check-staging-database.ts

    - name: Apply migrations to the staging DB
      shell: bash
      env:
        DATABASE_URL: ${{ inputs.database-url }}
      run: bun run db:migrate && bun run db:migrate-manual

    - name: Prepare the non-production tables and the development accounts
      shell: bash
      env:
        DATABASE_URL: ${{ inputs.database-url }}
      run: bun testing/prepare-staging-database.ts
